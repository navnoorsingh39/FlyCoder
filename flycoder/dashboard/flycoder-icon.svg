<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="FlyCoder">
  <!-- Original FlyCoder mark: Drosophila silhouette + two synaptic nodes. Not a reconstruction. -->
  <defs>
    <clipPath id="mark">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#030607"/>
  <g clip-path="url(#mark)">

  <!-- wings -->
  <ellipse cx="8.8" cy="17.6" rx="7.6" ry="3.05" transform="rotate(-40 8.8 17.6)" fill="#7ed4e0" fill-opacity="0.42"/>
  <ellipse cx="23.2" cy="17.6" rx="7.6" ry="3.05" transform="rotate(40 23.2 17.6)" fill="#7ed4e0" fill-opacity="0.42"/>

  <!-- body -->
  <ellipse cx="16" cy="22.8" rx="3.05" ry="5.05" fill="#5fb8c6"/>
  <ellipse cx="16" cy="15.5" rx="4.15" ry="3.45" fill="#8ef0ad"/>
  <ellipse cx="16" cy="9.85" rx="3.2" ry="3.0" fill="#7ed4e0"/>

  <!-- antennae -->
  <path d="M14.5 7.85 L12.2 5.15" fill="none" stroke="#7ed4e0" stroke-width="0.95" stroke-linecap="round"/>
  <path d="M17.5 7.85 L19.8 5.15" fill="none" stroke="#7ed4e0" stroke-width="0.95" stroke-linecap="round"/>

  <!-- synaptic nodes on thorax -->
  <line x1="13.15" y1="15.35" x2="18.85" y2="15.35" stroke="#7ed4e0" stroke-width="0.7" stroke-linecap="round"/>
  <circle cx="13.15" cy="15.35" r="1.7" fill="#030607"/>
  <circle cx="18.85" cy="15.35" r="1.7" fill="#030607"/>
  <circle cx="13.15" cy="15.35" r="1.7" fill="none" stroke="#8ef0ad" stroke-width="0.75"/>
  <circle cx="18.85" cy="15.35" r="1.7" fill="none" stroke="#8ef0ad" stroke-width="0.75"/>
  <circle cx="13.15" cy="15.35" r="0.62" fill="#7ed4e0"/>
  <circle cx="18.85" cy="15.35" r="0.62" fill="#7ed4e0"/>
  </g>
  <rect x="0.7" y="0.7" width="30.6" height="30.6" rx="6.3" fill="none" stroke="#24302b" stroke-width="0.55"/>
</svg>
